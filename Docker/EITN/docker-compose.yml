services:
  devenv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLATFORM: ${PLATFORM:-linux/amd64}
    container_name: eitn-devenv
    platform: ${PLATFORM:-linux/amd64}
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
    ports:
      - "8080:8080"
      - "3000:3000"
    restart: unless-stopped
